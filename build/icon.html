<!doctype html>
<!-- Source for build/icon.png. Regenerate with: npm run icon -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/pages/fonts/fonts.css">
<style>
  html, body { margin: 0; background: transparent; }
  .icon {
    width: 512px; height: 512px; position: relative; overflow: hidden;
    box-sizing: border-box; border-radius: 0;
  }
  .tile {
    position: absolute; inset: 24px; border-radius: 114px; overflow: hidden;
    background: url(../src/pages/sky.jpg) 38% 52% / 300% auto no-repeat #5f6879;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18);
  }
  .tile::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(rgba(40, 42, 52, 0.12), rgba(40, 42, 52, 0.32));
  }
  .mark {
    position: absolute; inset: 0; z-index: 1; display: grid; place-items: center;
    color: #fff; font: 400 360px/1 "Cormorant Garamond", Georgia, serif;
    padding-bottom: 28px; text-shadow: 0 6px 30px rgba(30, 32, 40, 0.35);
  }
</style></head>
<body><div class="icon"><div class="tile"><div class="mark">B</div></div></div></body></html>
