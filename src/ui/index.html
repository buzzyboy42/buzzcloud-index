<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self'; font-src 'self'">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="tabstrip">
    <span id="wordmark"></span>
    <span id="private-label">PRIVATE</span>
    <div id="tabs"></div>
    <button id="new-tab" class="icon" title="New tab (Ctrl+T)">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </div>
  <div id="toolbar">
    <button id="back" class="icon" title="Back (Alt+Left)">
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button id="forward" class="icon" title="Forward (Alt+Right)">
      <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>
    </button>
    <button id="reload" class="icon" title="Reload (Ctrl+R)">
      <svg class="reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
      <svg class="stop" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
    <button id="home" class="icon" title="Home (Alt+Home)">
      <svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg>
    </button>
    <form id="address-form">
      <span id="site-icon" title=""></span>
      <input id="address" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      <button id="bookmark" type="button" class="icon small" title="Bookmark this page (Ctrl+D)">
        <svg viewBox="0 0 16 16"><path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z"/></svg>
      </button>
    </form>
    <button id="shield" class="icon" title="Ad & tracker blocking">
      <svg viewBox="0 0 16 16"><path d="M8 1.8 13 3.6v4c0 3.2-2.1 5.6-5 6.6-2.9-1-5-3.4-5-6.6v-4z"/></svg>
      <span id="blocked-count"></span>
    </button>
    <button id="update" class="pill" hidden>Restart to update</button>
    <button id="menu" class="icon" title="Menu">
      <svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
    </button>
  </div>
  <script src="ui.js"></script>
</body>
</html>
